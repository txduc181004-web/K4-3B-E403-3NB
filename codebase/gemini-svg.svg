<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background:#f8fafc; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- TIÊU ĐỀ HỆ THỐNG -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">SƠ ĐỒ LUỒNG HÀNH TRÌNH TRẢI NGHIỆM VLEARN TUTOR</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#64748b">Cơ chế Augment: AI phát hiện cụm tín hiệu &amp; Trích xuất Evidence • Giảng viên ra quyết định sư phạm</text>

  <!-- 3 VÙNG / SWIMLANES -->
  <!-- Vùng 1: Dữ liệu vào -->
  <rect x="30" y="95" width="250" height="780" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="30" y="95" width="250" height="40" rx="12" fill="#dcfce7"/>
  <text x="155" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">1. DỮ LIỆU &amp; TIỀN XỬ LÝ</text>

  <!-- Vùng 2: AI Quyết định & 4 Đường trải nghiệm -->
  <rect x="300" y="95" width="530" height="780" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="300" y="95" width="530" height="40" rx="12" fill="#e2e8f0"/>
  <text x="565" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">2. ĐIỂM GỌI AI &amp; 4 ĐƯỜNG TRẢI NGHIỆM (SPEC §6)</text>

  <!-- Vùng 3: Giảng viên duyệt & Ra quyết định -->
  <rect x="850" y="95" width="320" height="780" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="850" y="95" width="320" height="40" rx="12" fill="#fef3c7"/>
  <text x="1010" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">3. GIẢNG VIÊN (AUGMENT)</text>

  <!-- CÁC NODE TRONG VÙNG 1 -->
  <!-- Nguồn chatlog -->
  <g filter="url(#shadow)">
    <rect x="50" y="160" width="210" height="95" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="155" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">tutor_turns.csv</text>
    <text x="155" y="205" text-anchor="middle" font-size="11" fill="#475569">• 13.494 lượt hỏi-đáp</text>
    <text x="155" y="223" text-anchor="middle" font-size="11" fill="#475569">• Postgre qua Superset</text>
    <text x="155" y="241" text-anchor="middle" font-size="11" fill="#475569">• Mốc 22/07 → 15/09</text>
  </g>

  <!-- Tiền xử lý -->
  <g filter="url(#shadow)">
    <rect x="50" y="300" width="210" height="75" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="155" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Tiền xử lý &amp; Làm sạch</text>
    <text x="155" y="345" text-anchor="middle" font-size="11" fill="#475569">• Lọc hội thoại rỗng, icon</text>
    <text x="155" y="361" text-anchor="middle" font-size="11" fill="#475569">• Trích xuất cặp Question-Turn</text>
  </g>

  <!-- CÁC NODE TRONG VÙNG 2 -->
  <!-- Điểm gọi AI -->
  <g filter="url(#shadow)">
    <polygon points="565,220 710,290 565,360 420,290" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="565" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">AI Gom Cụm Ngữ Nghĩa</text>
    <text x="565" y="300" text-anchor="middle" font-size="11" fill="#6d28d9">&amp; Phát Hiện Tín Hiệu Nghẽn</text>
  </g>

  <!-- Nhánh 1: Failure / No-grounding -->
  <g filter="url(#shadow)">
    <rect x="320" y="410" width="230" height="85" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="435" y="433" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">① No Grounding / Dữ liệu rỗng</text>
    <text x="435" y="453" text-anchor="middle" font-size="11" fill="#b91c1c">• Log rỗng hoặc toàn câu chào</text>
    <text x="435" y="470" text-anchor="middle" font-size="11" fill="#475569">→ Hiện Empty State trung thực</text>
    <text x="435" y="485" text-anchor="middle" font-size="10" fill="#64748b">(Gợi ý mở rộng bộ lọc mốc ngày)</text>
  </g>

  <!-- Nhánh 2: Low-Confidence -->
  <g filter="url(#shadow)">
    <rect x="320" y="525" width="230" height="95" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="435" y="547" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">② Low-Confidence (HAX G10)</text>
    <text x="435" y="567" text-anchor="middle" font-size="11" fill="#b45309">• Tín hiệu mờ nhạt, câu hỏi cụt</text>
    <text x="435" y="585" text-anchor="middle" font-size="11" fill="#b45309">• Thu hẹp: Đưa vào "Cần theo dõi"</text>
    <text x="435" y="603" text-anchor="middle" font-size="10" fill="#64748b">• Gắn badge cảnh báo độ tin cậy thấp</text>
  </g>

  <!-- Nhánh 3: Happy Path -->
  <g filter="url(#shadow)">
    <rect x="580" y="440" width="230" height="120" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="695" y="465" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">Happy Path (Tự tin cao)</text>
    <text x="695" y="487" text-anchor="middle" font-size="11" fill="#047857">• Tín hiệu hỏi lặp &amp; nghẽn rõ ràng</text>
    <text x="695" y="505" text-anchor="middle" font-size="11" fill="#047857">• Gom nhóm thành Cụm Lỗ Hổng</text>
    <text x="695" y="524" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">• Trích xuất Evidence (HAX G11)</text>
    <text x="695" y="542" text-anchor="middle" font-size="10" fill="#475569">(Kèm nguyên văn câu hỏi, thời gian)</text>
  </g>

  <!-- Output trung gian: Bản đồ lỗ hổng -->
  <g filter="url(#shadow)">
    <rect x="450" y="670" width="240" height="70" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="570" y="698" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Giao diện: Bản đồ Lỗ hổng</text>
    <text x="570" y="720" text-anchor="middle" font-size="11" fill="#2563eb">Phân bố chủ đề &amp; Cường độ tắc nghẽn</text>
  </g>

  <!-- CÁC NODE TRONG VÙNG 3 -->
  <!-- Giảng viên tương tác -->
  <g filter="url(#shadow)">
    <rect x="875" y="240" width="270" height="90" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1010" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Giảng viên / TA Xem Evidence</text>
    <text x="1010" y="290" text-anchor="middle" font-size="11" fill="#475569">• Đọc trích đoạn chatlog gốc</text>
    <text x="1010" y="308" text-anchor="middle" font-size="11" fill="#475569">• Đối chiếu giáo trình &amp; bài giảng</text>
  </g>

  <!-- Nhánh Correction / Dismissal -->
  <g filter="url(#shadow)">
    <rect x="875" y="390" width="270" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="1010" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">④ Hiệu chỉnh (HAX G8 &amp; G9)</text>
    <text x="1010" y="438" text-anchor="middle" font-size="11" fill="#475569">• Gạt bỏ: Xóa câu hỏi spam/thủ tục (G8)</text>
    <text x="1010" y="458" text-anchor="middle" font-size="11" fill="#475569">• Sửa dễ: Đổi tên chủ đề, gộp cụm (G9)</text>
    <text x="1010" y="478" text-anchor="middle" font-size="10" fill="#0284c7">→ Lưu phản hồi cải thiện bộ Prompt/LLM</text>
  </g>

  <!-- Quyết định chuyên môn cuối cùng -->
  <g filter="url(#shadow)">
    <rect x="875" y="630" width="270" height="135" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1010" y="660" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Quyết Định Chuyên Môn</text>
    <text x="1010" y="682" text-anchor="middle" font-size="11" fill="#92400e">(AI KHÔNG tự làm - Cost-of-error cao)</text>
    <text x="1010" y="707" text-anchor="middle" font-size="11" fill="#451a03">1. Dành 15 phút đầu giờ giảng lại</text>
    <text x="1010" y="727" text-anchor="middle" font-size="11" fill="#451a03">2. Bổ sung bài tập củng cố kiến thức</text>
    <text x="1010" y="747" text-anchor="middle" font-size="11" fill="#451a03">3. Chỉ định TA hỗ trợ riêng học viên</text>
  </g>

  <!-- KẾT THÚC -->
  <rect x="875" y="800" width="270" height="45" rx="22" fill="#15803d"/>
  <text x="1010" y="828" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">HỌC VIÊN ĐƯỢC GIẢI TỎA LỖ HỔNG</text>

  <!-- CÁC ĐƯỜNG LIÊN KẾT / MŨI TÊN -->
  <!-- Từ Input -> Preprocess -->
  <line x1="155" y1="255" x2="155" y2="295" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Từ Preprocess -> AI Call -->
  <path d="M 260 337 L 340 337 L 340 290 L 415 290" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Từ AI Call -> Nhánh 1 (No Grounding) -->
  <path d="M 465 315 L 435 315 L 435 405" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <!-- Từ AI Call -> Nhánh 2 (Low Confidence) -->
  <path d="M 515 335 L 515 540 L 435 540 L 435 520" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <!-- Từ AI Call -> Nhánh 3 (Happy Path) -->
  <path d="M 665 315 L 695 315 L 695 435" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Từ Nhánh 2 & 3 -> Dashboard -->
  <path d="M 550 580 L 570 580 L 570 665" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 695 560 L 695 620 L 590 620 L 590 665" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Từ Dashboard sang Giảng viên Review -->
  <path d="M 690 705 L 810 705 L 810 285 L 870 285" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Từ Giảng viên -> Nhánh Hiệu chỉnh -->
  <line x1="1010" y1="330" x2="1010" y2="385" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Từ Nhánh Hiệu chỉnh loop lại AI -->
  <path d="M 875 445 L 825 445 L 825 250 L 715 250" fill="none" stroke="#94a3b8" stroke-dasharray="4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Từ Giảng viên -> Quyết định Sư phạm -->
  <line x1="1010" y1="500" x2="1010" y2="625" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="1010" y1="765" x2="1010" y2="795" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
</svg>
